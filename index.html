<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>People Playground</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #111; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; font: 14px sans-serif; color: #ccc; text-align: center; }
      #bar { margin-top: 10px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #ddd; }
      #msg { position: absolute; top: 0; left: 0; right: 0; font: 13px sans-serif; color: #000; }
      #msg div { padding: 8px; background: #fd5; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading People Playground...<div id="bar"><div id="fill"></div></div></div>
    <div id="msg"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function showBanner(text, type) {
        var div = document.createElement("div");
        div.textContent = text;
        if (type == "error") div.style.background = "#f55";
        document.querySelector("#msg").appendChild(div);
        if (type != "error") setTimeout(function () { div.remove(); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/ppg.data.unityweb",
        frameworkUrl: buildUrl + "/ppg.framework.js.unityweb",
        codeUrl: buildUrl + "/ppg.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Studio Minus",
        productName: "People Playground",
        productVersion: "",
        showBanner: showBanner,
      };

      // Render at the screen's real pixel density so text and UI are sharp, capped at 2x so 4K/HiDPI
      // screens don't render 9-16x the pixels through bloom and lighting. Override with ?scale=1 (faster,
      // softer text on HiDPI screens), ?scale=0.75 for weak machines, or ?scale=2 for maximum sharpness.
      var scale = parseFloat(new URLSearchParams(window.location.search).get("scale"));
      config.devicePixelRatio = (scale > 0 && scale <= 4) ? scale : Math.min(window.devicePixelRatio || 1, 2);

      var script = document.createElement("script");
      script.src = buildUrl + "/ppg.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loading").style.display = "none";
          window.unityInstance = unityInstance;
          canvas.focus();
        }).catch(function (message) {
          showBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
